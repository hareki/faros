packages:
  - packages/emails

minimumReleaseAgeStrict: true
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  inngest-cli: true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

catalog:
  clsx: ^2.1.1
  react: 19.2.6
  react-dom: 19.2.6
  tailwind-merge: ^3.6.0
  '@types/node': ^24.12.4
  '@types/react': ^19.2.15
  '@types/react-dom': ^19.2.3

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - esbuild
  - inngest-cli
  - msw
  - protobufjs
